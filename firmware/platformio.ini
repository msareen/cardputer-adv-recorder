; Cardputer ADV Recorder

[platformio]
default_envs = cardputer-adv-recorder

[env:cardputer-adv-recorder]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
; The m5stack-stamps3 board already uses default_8MB.csv (two 3.2 MB app
; slots), which leaves room for WiFi, BLE and TLS.
; WiFi credentials arrive over BLE when pairing (milestone 4).
; NimBLE's host stack is far smaller than Bluedroid.
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
; M5GFX is listed before M5Unified so its pinned version satisfies
; M5Unified's dependency. 0.2.22 (upstream's pin) is no longer in the
; registry; 0.2.27 is the oldest 0.2.x still published.
lib_deps =
    m5stack/M5GFX@0.2.27
    m5stack/M5Unified@0.2.17
    z3t0/IRremote@4.7.1
    m5stack/M5Cardputer@1.1.1
    h2zero/NimBLE-Arduino@1.4.3

; Same firmware, with Serial on the USB port (the release build sends it to
; the UART pins, so `device monitor` over USB shows nothing). For debugging.
[env:cardputer-adv-recorder-debug]
extends = env:cardputer-adv-recorder
build_flags =
    ${env:cardputer-adv-recorder.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:native-tests]
platform = native
test_framework = unity
test_build_src = true
build_flags = -std=gnu++17
build_src_filter =
    -<*>
    +<media/wav_format.cpp>
    +<media/file_naming.cpp>
    +<media/recording_chunk.cpp>
    +<sync/sha256.cpp>
    +<sync/sync_index.cpp>
    +<sync/protocol.cpp>
    +<sync/cbor.cpp>
    +<sync/pairing_math.cpp>
