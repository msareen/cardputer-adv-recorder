[package]
name = "mock-device"
version = "0.1.0"
edition = "2021"
description = "Fake Cardputer ADV Recorder that serves the /v1 sync protocol from a folder of WAV files"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
