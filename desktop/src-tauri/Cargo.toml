[package]
name = "cprec-desktop"
version = "0.1.0"
description = "Desktop sync app for the Cardputer ADV Recorder"
authors = []
edition = "2024"
default-run = "cprec-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cprec_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Paired devices: HTTPS with mutual TLS and a verifier that pins the device
# key (tls.rs). Unpaired dev devices (tools/mock-device): plain HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "time", "sync", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
# Pairing (pairing.rs): ECDH, HKDF, AES-GCM, CBOR messages over BLE.
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
hkdf = "0.12"
hmac = "0.12"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
ciborium = "0.2"
btleplug = "0.11"
futures = "0.3"
uuid = "1"
# Discovery of devices in sync mode (_cprec._tcp.local), milestone 5.
mdns-sd = "0.21"
# Host key per (install, user) in the OS keychain; self-signed client cert.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rcgen = "0.13"
x509-parser = "0.16"
# Agent access (agent_mcp.rs): local MCP server over Streamable HTTP.
rmcp = { version = "3.11", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-util = "0.7"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
